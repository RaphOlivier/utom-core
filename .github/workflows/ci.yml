name: ci

on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core acceptance tests
        run: python utom_core.py
      - name: Geometry acceptance tests
        run: python utom_geometry.py

  diag:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Geometry acceptance tests (diagnostic)
        run: |
          set -o pipefail
          python utom_geometry.py 2>&1 | tee geo.log
      - name: Annotate failures
        if: failure()
        run: grep -E "FAIL|Error|Traceback|File \"|RÉSULTAT" geo.log | head -30 | sed 's/^/::error::/' || true

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build123d
        run: pip install build123d
      - name: build123d backend acceptance tests
        run: python utom_build123d.py
